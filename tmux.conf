set -g mouse on
set -g escape-time 0

# Vim keybindings
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode vim bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

#split panel on current path
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # save tmux session with prefix+ctrl+s, restore with prefix+ctrl+r
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically save tmux session every 15 mins
set -g @plugin 'tmux-plugins/tmux-sidebar' # added a directory sidebar
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @continuum-restore 'on' # automatically restore tmux session

# --- Nord-themed status bar ---
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=#2e3440,bg=#5e81ac,bold]  #S #[fg=#5e81ac,bg=#2e3440]"

setw -g window-status-format "#[fg=#2e3440,bg=#3b4252]#[fg=#d8dee9,bg=#3b4252] #I #W #[fg=#3b4252,bg=#2e3440]"
setw -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0]#[fg=#2e3440,bg=#88c0d0,bold] #I #W #[fg=#88c0d0,bg=#2e3440]"

set -g status-right "#{prefix_highlight} #[fg=#4c566a,bg=#2e3440]#[fg=#d8dee9,bg=#4c566a] #(~/.tmux/scripts/weather.sh) #[fg=#b48ead,bg=#4c566a]#[fg=#2e3440,bg=#b48ead,bold] 󰁝 Toronto#[fg=#a3be8c,bg=#b48ead]#[fg=#2e3440,bg=#a3be8c,bold] 󰁹 #(pmset -g batt | grep -o '[0-9]*%%' | head -1) #[fg=#5e81ac,bg=#a3be8c]#[fg=#d8dee9,bg=#5e81ac] %b %d #[fg=#88c0d0,bg=#5e81ac]#[fg=#2e3440,bg=#88c0d0,bold] %H:%M "

set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#3b4252,fg=#d8dee9"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
